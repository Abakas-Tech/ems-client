<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mager Properties | Real Estate Consultants</title>

    <!-- Basic Meta -->
    <meta
      name="description"
      content="Mager Properties is a trusted real estate consultancy helping clients buy, sell, and invest in premium properties with confidence. Manage listings, track inquiries, and grow your portfolio at magerproperty.com."
    />
    <meta
      name="keywords"
      content="real estate, Mager Properties, property consultant, property sales, real estate agents, property management, house for sale, buy property, property investment, magerproperty.com"
    />
    <meta
      name="subject"
      content="Mager Properties Real Estate Web App helps consultants and agents manage listings, track client inquiries, and organize property sales efficiently."
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="Mager Properties | Real Estate Consultants"
    />
    <meta
      property="og:description"
      content="Professional real estate consultancy offering property management, listings, and sales insights. Visit https://magerproperty.com to explore opportunities."
    />
    <meta
      property="og:image"
      content="https://magerproperty.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mager Properties Real Estate Web App"
    />
    <meta property="og:url" content="https://magerproperty.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mager Properties | Real Estate Consultants"
    />
    <meta
      name="twitter:description"
      content="Explore Mager Properties — a modern real estate platform for managing listings, tracking inquiries, and closing property sales efficiently."
    />
    <meta
      name="twitter:image"
      content="https://magerproperty.com/og-image.png"
    />

    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00305c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/icons/192.png" />

    <!-- Force HTTPS -->
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
